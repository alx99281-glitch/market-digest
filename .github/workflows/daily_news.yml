name: Daily Market News Digest

on:
  schedule:
    # 21:50 UTC = 05:50 SGT（他ワークフローより先に配信）
    - cron: '50 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Clean stale git state
        run: |
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git checkout -f 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk && fc-cache -fv

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news digest
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          FEEDBACK_FORM_URL:   ${{ secrets.FEEDBACK_FORM_URL }}
        run: python news_digest.py
