name: X Financial Digest

on:
  schedule:
    - cron: '5 22 * * *'   # 06:05 SGT 朝版（正時の混雑を避けてずらす）
    - cron: '5 10 * * *'   # 18:05 SGT 夕版
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-digest-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Clean stale git state
        run: |
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git checkout -f 2>/dev/null || true
          git clean -ffdx 2>/dev/null || true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run financial SNS digest
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python x_digest.py
